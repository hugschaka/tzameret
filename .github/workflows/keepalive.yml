# דופק לשרת המרכזי: מונע מהאינסטנס החינמי ב-Render להירדם (spin-down אחרי
# ~15 דקות שקט → התנעה קרה של עד דקה — קטלני ללינקי תשלום של תלמידים).
# קורא ל-/health כל 10 דקות. להסרה כשמשדרגים ל-Starter (always-on).
name: keepalive
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: ping central server
        # -m 90: מרווח נדיב להתנעה קרה אם בכל זאת נרדם; כישלון = ריצה אדומה
        # ב-Actions, שמשמשת גם כניטור זמינות בסיסי.
        run: curl -fsS -m 90 --retry 2 --retry-delay 5 https://tzameret-reflactor.onrender.com/health
