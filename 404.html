<!doctype html>
<html lang="he">
<head>
<meta charset="utf-8">
<title>צמרת</title>
<script>
// SPA fallback: deep links under an open-slide deck (/tzameret/deck/* customers,
// /tzameret/partners/* trust) are handed back to that deck app (which restores the
// path from sessionStorage); anything else goes to the site home.
var p = location.pathname + location.search + location.hash;
var base = ['/tzameret/deck/', '/tzameret/partners/', '/tzameret/security/'].filter(function (b) { return p.indexOf(b) === 0; })[0];
if (base) {
  sessionStorage.setItem('os-path', p);
  location.replace(base);
} else {
  location.replace('/tzameret/');
}
</script>
</head>
<body></body>
</html>
